<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | ورشة الخراطة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Cairo', 'sans-serif'] },
          colors: { brand: '#f97316', dark: { bg: '#0f1115', card: '#1a1d24' } }
        }
      }
    }
  </script>
</head>
<body class="bg-dark-bg text-gray-200 font-sans antialiased min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-dark-card border border-gray-800 rounded-2xl p-8 shadow-2xl">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-brand/10 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-brand/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-brand" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white">لوحة التحكم</h1>
      <p class="text-gray-400 text-sm mt-2">سجل دخولك عشان تعدل الموقع</p>
    </div>

    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-sm font-semibold text-gray-300 mb-2">البريد الإلكتروني</label>
        <input type="email" id="email" required class="w-full bg-dark-bg border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-300 mb-2">كلمة المرور</label>
        <input type="password" id="password" required class="w-full bg-dark-bg border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition">
      </div>
      <button type="submit" class="w-full bg-brand hover:bg-brand-dark text-white font-bold py-3 rounded-xl transition shadow-[0_0_15px_rgba(249,115,22,0.4)]">
        دخول
      </button>
    </form>
    
    <div class="mt-6 text-center">
      <a href="/" class="text-gray-500 hover:text-brand text-sm transition">← العودة للموقع</a>
    </div>
  </div>

</body>
</html>
