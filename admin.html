<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | ورشة الخراطة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Cairo', 'sans-serif'] }, colors: { brand: '#f97316', dark: { bg: '#0f1115', card: '#1a1d24' } } } }
    }
  </script>
</head>
<body class="bg-dark-bg text-gray-200 font-sans antialiased min-h-screen">

  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-dark-card border border-gray-800 rounded-2xl p-8 shadow-2xl">
      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-white">لوحة التحكم</h1>
        <p class="text-gray-400 text-sm mt-2">سجل دخولك برقم الموبايل</p>
      </div>
      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-gray-300 mb-2">رقم الموبايل</label>
          <input type="tel" id="phone" required pattern="[0-9]+" inputmode="numeric" placeholder="01126346329" class="w-full bg-dark-bg border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand text-left" dir="ltr">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-300 mb-2">كلمة المرور</label>
          <input type="password" id="password" required class="w-full bg-dark-bg border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand text-left" dir="ltr">
        </div>
        <button type="submit" id="loginBtn" class="w-full bg-brand hover:bg-brand-dark text-white font-bold py-3 rounded-xl transition">دخول</button>
        <p id="loginError" class="text-red-500 text-sm text-center hidden"></p>
      </form>
      <div class="mt-6 text-center">
        <a href="/" class="text-gray-500 hover:text-brand text-sm transition">← العودة للموقع</a>
      </div>
    </div>
  </div>

  <div id="dashboard" class="hidden max-w-4xl mx-auto p-4 md:p-8">
    <div class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
      <h1 class="text-2xl font-bold text-white">مرحباً بك</h1>
      <button id="logoutBtn" class="text-sm bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white px-4 py-2 rounded-lg transition">تسجيل خروج</button>
    </div>
    <div class="bg-dark-card border border-gray-800 rounded-2xl p-6 mb-8">
      <h2 class="text-xl font-bold text-white mb-4">إعدادات الموقع</h2>
      <form id="settingsForm" class="space-y-4">
        <div><label class="block text-sm text-gray-400 mb-1">اسم الورشة</label><input type="text" id="siteName" class="w-full bg-dark-bg border border-gray-700 rounded-lg px-4 py-2 text-white"></div>
        <div><label class="block text-sm text-gray-400 mb-1">العنوان الرئيسي</label><input type="text" id="heroTitle" class="w-full bg-dark-bg border border-gray-700 rounded-lg px-4 py-2 text-white"></div>
        <div><label class="block text-sm text-gray-400 mb-1">الوصف</label><textarea id="heroDesc" rows="2" class="w-full bg-dark-bg border border-gray-700 rounded-lg px-4 py-2 text-white"></textarea></div>
        <div><label class="block text-sm text-gray-400 mb-1">نص الحقوق (اكتب 2026)</label><input type="text" id="footerText" class="w-full bg-dark-bg border border-gray-700 rounded-lg px-4 py-2 text-white"></div>
        <button type="submit" class="bg-brand text-white px-6 py-2 rounded-lg font-bold">حفظ الإعدادات</button>
        <span id="settingsMsg" class="text-green-500 text-sm hidden">تم الحفظ بنجاح!</span>
      </form>
    </div>
    <div class="bg-dark-card border border-gray-800 rounded-2xl p-6 mb-8">
      <h2 class="text-xl font-bold text-white mb-4">إضافة مشروع جديد</h2>
      <form id="projectForm" class="space-y-4">
        <div><label class="block text-sm text-gray-400 mb-1">اسم المشروع</label><input type="text" id="projTitle" required class="w-full bg-dark-bg border border-gray-700 rounded-lg px-4 py-2 text-white"></div>
        <div><label class="block text-sm text-gray-400 mb-1">صورة المشروع</label><input type="file" id="projImage" accept="image/*" required class="w-full text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-brand/10 file:text-brand hover:file:bg-brand/20"></div>
        <button type="submit" id="projBtn" class="bg-brand text-white px-6 py-2 rounded-lg font-bold">رفع المشروع</button>
        <p id="projMsg" class="text-sm hidden"></p>
      </form>
    </div>
    <div class="bg-dark-card border border-gray-800 rounded-2xl p-6">
      <h2 class="text-xl font-bold text-white mb-4">المشاريع الحالية</h2>
      <div id="projectsList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <p class="text-gray-400 text-center col-span-full">جاري التحميل...</p>
      </div>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://bcsujoqqluydqwjwcfnq.supabase.co';
    const supabaseKey = 'sb_publishable_S41G37JO-oUQrZf3g4q-OQ_hZzkIbB5';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    const loginScreen = document.getElementById('loginScreen');
    const dashboard = document.getElementById('dashboard');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    // المهم: مراقبة حالة الدخول
    supabase.auth.onAuthStateChange((event, session) => {
      if (session) {
        showDashboard();
      } else {
        loginScreen.classList.remove('hidden');
        dashboard.classList.add('hidden');
      }
    });

    // التحقق من الجلسة أول ما الصفحة تفتح
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) showDashboard();
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginBtn.textContent = 'جاري الدخول...';
      loginBtn.disabled = true;
      loginError.classList.add('hidden');
      
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const email = phone + '@iron-workshop.com'; // الخدعة

      const { error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        loginError.textContent = 'الرقم أو كلمة المرور غير صحيحة';
        loginError.classList.remove('hidden');
        loginBtn.textContent = 'دخول';
        loginBtn.disabled = false;
      } else {
        loginBtn.textContent = 'دخول';
        loginBtn.disabled = false;
        // الـ onAuthStateChange هيفتح الداشبورد لوحده
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await supabase.auth.signOut();
    });

    function showDashboard() {
      loginScreen.classList.add('hidden');
      dashboard.classList.remove('hidden');
      loadSettings();
      loadProjects();
    }

    async function loadSettings() {
      const { data } = await supabase.from('settings').select('*').eq('id', 1).single();
      if (data) {
        document.getElementById('siteName').value = data.site_name || '';
        document.getElementById('heroTitle').value = data.hero_title || '';
        document.getElementById('heroDesc').value = data.hero_desc || '';
        document.getElementById('footerText').value = data.footer_text || '';
      }
    }

    document.getElementById('settingsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const updates = {
        site_name: document.getElementById('siteName').value,
        hero_title: document.getElementById('heroTitle').value,
        hero_desc: document.getElementById('heroDesc').value,
        footer_text: document.getElementById('footerText').value,
      };
      const { error } = await supabase.from('settings').update(updates).eq('id', 1);
      const msg = document.getElementById('settingsMsg');
      if (error) { alert('خطأ: ' + error.message); }
      else { msg.classList.remove('hidden'); setTimeout(() => msg.classList.add('hidden'), 3000); }
    });

    document.getElementById('projectForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('projBtn');
      const msg = document.getElementById('projMsg');
      const title = document.getElementById('projTitle').value;
      const file = document.getElementById('projImage').files[0];
      
      btn.textContent = 'جاري الرفع...';
      btn.disabled = true;
      msg.classList.add('hidden');

      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}.${fileExt}`;
      const { error: uploadError } = await supabase.storage.from('workshop_images').upload(fileName, file);
      
      if (uploadError) {
        alert('خطأ في رفع الصورة: ' + uploadError.message);
        btn.textContent = 'رفع المشروع';
        btn.disabled = false;
        return;
      }

      const { data: { publicUrl } } = supabase.storage.from('workshop_images').getPublicUrl(fileName);
      const { error: dbError } = await supabase.from('projects').insert([{ title, image_url: publicUrl }]);

      if (dbError) {
        alert('خطأ في حفظ المشروع: ' + dbError.message);
      } else {
        msg.textContent = 'تم رفع المشروع بنجاح!';
        msg.className = 'text-green-500 text-sm mt-2';
        msg.classList.remove('hidden');
        document.getElementById('projectForm').reset();
        loadProjects();
      }
      btn.textContent = 'رفع المشروع';
      btn.disabled = false;
    });

    async function loadProjects() {
      const list = document.getElementById('projectsList');
      const { data, error } = await supabase.from('projects').select('*').order('created_at', { ascending: false });
      
      if (error || !data || data.length === 0) {
        list.innerHTML = '<p class="text-gray-400 text-center col-span-full">لا توجد مشاريع بعد.</p>';
        return;
      }

      list.innerHTML = data.map(proj => `
        <div class="relative group bg-dark-bg border border-gray-800 rounded-xl overflow-hidden">
          <img src="${proj.image_url}" alt="${proj.title}" class="w-full h-40 object-cover">
          <div class="p-4 flex justify-between items-center">
            <span class="font-bold text-white">${proj.title}</span>
            <button onclick="deleteProject(${proj.id})" class="text-red-500 hover:text-red-400 text-sm bg-red-500/10 px-3 py-1 rounded">حذف</button>
          </div>
        </div>
      `).join('');
    }

    window.deleteProject = async (id) => {
      if (!confirm('هل أنت متأكد من الحذف؟')) return;
      const { error } = await supabase.from('projects').delete().eq('id', id);
      if (error) alert('خطأ: ' + error.message);
      else loadProjects();
    };
  </script>
</body>
</html>
