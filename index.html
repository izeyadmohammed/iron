<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورشة الخراطة | الهندسة الدقيقة وتشكيل المعادن</title>
    <meta name="description" content="ورشة خراطة متخصصة في خراطة CNC، تصنيع التروس والأعمدة، وتشكيل المعادن بدقة عالية." />
    <meta property="og:title" content="ورشة الخراطة | الهندسة الدقيقة وتشكيل المعادن" />
    <meta property="og:description" content="ورشة خراطة متخصصة في خراطة CNC، تصنيع التروس والأعمدة، وتشكيل المعادن بدقة عالية." />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('workshop_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-zinc-50 dark:bg-[#0B0D10] text-zinc-900 dark:text-zinc-100 antialiased selection:bg-orange-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
