<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة إدارة الورشة | ورشة الخراطة</title>
  <script>
    (function () {
      var p = window.location.pathname;
      var base = p.replace(/\/admin(?:\/index\.html|\/|\.html)?$/i, '/');
      if (!base.endsWith('/')) base += '/';
      window.location.replace(base + '#/admin');
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0;url=../#/admin" />
  </noscript>
</head>
<body style="background:#0B0D10;color:#F3F4F6;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center;">
  <div>
    <p>جاري فتح لوحة الإدارة...</p>
    <p><a href="../#/admin" style="color:#f97316;">اضغط هنا إذا لم يتم التحويل تلقائياً</a></p>
  </div>
</body>
</html>
